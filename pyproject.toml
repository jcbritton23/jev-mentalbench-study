[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-psych-project"
version = "0.1.0"
description = "Small, reproducible Jev psychology-classification experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk>=0.7.2,<0.8",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
only-include = ["scripts/smoke_test.py"]
